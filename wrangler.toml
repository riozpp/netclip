name = "netclip"
main = "src/index.js"
compatibility_date = "2025-06-01"

# 自定义域名：qsy.20240225.xyz（Cloudflare 自动签发证书并创建 DNS 记录）
routes = [
  { pattern = "qsy.20240225.xyz", custom_domain = true }
]

# 同时保留 <name>.<subdomain>.workers.dev 的备用入口
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

[vars]
PARSE_LIMIT_PER_HOUR = "60"

# 可选：绑定 KV 后限流改为分布式计数（推荐生产开启）
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "<your-kv-namespace-id>"

# 可选：抖音 / TikTok 备用解析通道（第三层降级）
# [vars.DOUYIN_FALLBACK_API]  ->  自建或可信的转发服务地址
